titel: CRM-inrichting
volgorde: 10
icoon: settings-2
kort: Pipedrive op jouw verkoopproces, en wat het kan
kop: Pipedrive inrichten op jouw verkoopproces
meta: >-
  Pipedrive ingericht op hoe jij verkoopt, met migratie uit Excel of je oude
  systeem. Door een Pipedrive-consultant uit 's-Hertogenbosch.
tekst: >-
  Pipedrive ingericht op hoe jij verkoopt, inclusief de stappen die alleen bij
  jou zo gaan.
punten:
  - Pipelines en fases die je proces volgen
  - Migratie uit Excel, mailbox of een oud systeem
  - Velden, rechten en rapportage
  - Nova inrichten, de AI in Pipedrive
oplevert:
  - Iedereen werkt op dezelfde manier
  - Je ziet in een oogopslag wat er loopt en wat eraan komt
  - Je oude gegevens staan erin, opgeschoond en bruikbaar
  - Nova geeft antwoorden waar je op kunt bouwen
voorWie: >-
  Voor bedrijven die nog met Excel-bestanden werken, of met een CRM dat niemand
  echt gebruikt. Dat systeem is dan slecht ingericht, het hangt nergens aan
  vast, of allebei. Een nieuw systeem kiezen is zo gebeurd. De vraag is wat er
  met je bestaande gegevens gebeurt.
verhaal:
  - kop: Waarom Pipedrive
    alineas:
      - >-
        Pipedrive is overzichtelijk, en daardoor blijft een team het gebruiken.
        Het is betaalbaar voor een klein bedrijf en het koppelt met bijna alles.
        Daarom is het meestal mijn keuze.
      - >-
        Past het niet bij jouw proces, dan hoor je dat in het eerste gesprek.
        Ook als dat betekent dat ik je naar iemand anders verwijs.
  - kop: De migratie is het eigenlijke werk
    alineas:
      - >-
        Gegevens overzetten klinkt als kopiëren. Dat is het niet. In een oude
        database of een Excel staat elke kolom er met een reden, en die reden
        staat nergens opgeschreven. Een veld dat status heet, betekent bij
        verkoop iets anders dan bij de administratie. Voordat er iets overgaat,
        zoek ik uit hoe die gegevens tot stand zijn gekomen.
      - >-
        Daarna gaan ze het nieuwe proces in, en dat is één manier van werken
        voor iedereen. Soms betekent dat samenvoegen, soms weggooien, en soms
        blijkt dat twee afdelingen hetzelfde woord voor iets anders gebruiken.
        Die gesprekken horen bij de inrichting.
      - >-
        Je kunt ook fris beginnen. Dat is sneller en het gebeurt vaker dan je
        zou denken. Toch neem ik de historie mee, want een klant van vier jaar
        geleden kan morgen bellen. Op dat moment wil je zien wat je destijds
        hebt afgesproken.
  - kop: Nova laten werken
    alineas:
      - >-
        Elk CRM krijgt nu AI aan boord. In Pipedrive heet die Nova. Hij vat
        gesprekken samen, houdt gegevens bij en stelt een volgende stap voor.
      - >-
        Die AI is zo goed als de gegevens waar hij in kijkt. Staan er dubbele
        contacten in, of velden die iedereen anders invult, dan krijg je
        zelfverzekerde onzin terug. Nova inrichten begint daarom bij opschonen.
        Eén betekenis per veld, fases die kloppen, en afspraken over wat het
        team vastlegt.
extra:
  - functies
