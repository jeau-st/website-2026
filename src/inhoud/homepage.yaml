kernpunten:
  - Je proces vastgelegd in Pipedrive, voor iedereen hetzelfde
  - Eén bron van waarheid voor je hele team
  - Koppelingen met de systemen die je al gebruikt
  - Rapportages waar je op kunt sturen
  - Een basis die strak genoeg is voor AI
inHetKort:
  - vraag: Wie
    antwoord: Joost Beers. Tien jaar ervaring met systeemimplementaties, salesteams en data-analyse bij mkb en scale-ups.
  - vraag: Wat
    antwoord: Je proces in één systeem, je systemen aan elkaar, het handwerk ertussenuit en een basis voor AI.
  - vraag: Waar
    antwoord: Vanuit 's-Hertogenbosch. Overleg gaat online, en op locatie als dat beter werkt, bijvoorbeeld voor de trainingen.
  - vraag: Wanneer
    antwoord: Zodra je gegevens tussen twee systemen zit over te typen, er handgeschreven notities verspreid op je bureau liggen en een simpel overzichtje een uur kost.
  - vraag: Waarom
    antwoord: Omdat je werk sneller, beter en leuker wordt.
  - vraag: Hoe
    antwoord: Het beste systeem en proces voor jou, automatiseren waar het loont, overzicht en inzicht maken, en blijven verbeteren.
