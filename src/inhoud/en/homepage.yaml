kernpunten:
  - Your process written down in Pipedrive, the same for everyone
  - One source of truth for your whole team
  - Integrations with the systems you already use
  - Reporting you can steer on
  - A basis tight enough for AI
inHetKort:
  - vraag: Who
    antwoord: Joost Beers. Ten years of experience with system implementations, sales teams and data analysis at small and growing companies.
  - vraag: What
    antwoord: Your process in one system, your systems connected, the manual work taken out and a basis for AI.
  - vraag: Where
    antwoord: From 's-Hertogenbosch in the Netherlands. Meetings go online, and on site when that works better, training for instance.
  - vraag: When
    antwoord: As soon as you are retyping data between two systems, handwritten notes are spread across your desk and a simple overview costs an hour.
  - vraag: Why
    antwoord: Because your work gets faster, better and more enjoyable.
  - vraag: How
    antwoord: The best system and process for you, automation where it pays off, overview and insight, and then keep improving.
