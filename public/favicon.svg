<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Jeau.st">
    <!--
        De punt uit het woordmerk, los: vier vierkantjes, 2 bij 2. Hier
        stond het logo van Astro nog.

        Het raster is gekozen op 16 bij 16, want daar wordt een favicon
        bijna altijd getekend. Kantlijn 8, vierkantje 48, tussenruimte 16,
        dus de randen liggen op 8, 56, 72 en 120. Gedeeld door acht is dat
        1, 7, 9 en 15: hele pixels op 16 bij 16, en dus geen halve rand
        die de browser moet verzinnen. De tussenruimte is daarmee breder
        dan tussen de pixels van het woordmerk; op 16 pixels zou een
        smalle naad dichtlopen tot een vlak.

        Geen rondingen: het merk is een pixelvorm.

        Twee vaste kleuren, geen prefers-color-scheme. Een favicon staat
        op de tabbalk van de browser en niet op de site, dus het thema van
        de site zegt er niets over, en de ondergrond is per browser anders.
        Deze twee halen op alle vier de gangbare tabbalken meer dan 3,4:1,
        de norm voor een vlak dat geen tekst is:

                              wit   Chrome licht   Chrome donker   Firefox donker
        zacht   #6d8595      3,86       3,49            4,17            3,67
        accent  #c76a19      3,82       3,44            4,22            3,71

        Allebei komen uit het palet. Het accent is het oranje van het
        donkere thema; dat van het lichte haalt op een donkere tabbalk
        maar 3,1:1.
    -->
    <g fill="#6d8595">
        <path d="M8 8h48v48H8z" />
        <path d="M72 8h48v48H72z" />
        <path d="M8 72h48v48H8z" />
    </g>
    <path fill="#c76a19" d="M72 72h48v48H72z" />
</svg>
